[project]
name = "mp"
version = "0.1.0"
description = "Manutenção preditiva 4.0: RUL (LSTM) + triagem de OS (PLN)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
train = ["keras>=3", "torch", "onnx", "onnxscript", "onnxruntime"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
