[project]
name = "mp"
version = "0.1.0"
description = "Manutenção preditiva 4.0: RUL (LSTM) + triagem de OS (PLN)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "onnxruntime", "prometheus-client", "joblib", "tokenizers>=0.19"]
bert = ["transformers>=4.40", "torch", "onnx", "onnxscript", "onnxruntime"]
train = ["keras>=3", "torch", "onnx", "onnxscript", "onnxruntime"]
nlp = [
    "spacy>=3.7",
    "gensim>=4.3",
    "pt_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
